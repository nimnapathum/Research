services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_trust_portal
      POSTGRES_USER: study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d security_trust_portal"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  portal_postgres:
